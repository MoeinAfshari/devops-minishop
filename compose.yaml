services:
  
  nginx:
    build:
      context: ./nginx

    container_name: 
      minishop-nginx

    ports:
      - "80:80"

    depends_on:
      - backend

    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

    networks:
      - minishop-network
    
    restart: unless-stopped

  backend:
    build:
      context: ./backend

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    container_name: 
      minishop-backend

    expose:
      - "3000"

    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

    environment:
      NODE_ENV: development
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - minishop-network
    
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:3000/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

    restart: unless-stopped

  postgres:
    image: 
      postgres:16

    container_name: 
      minishop-postgres

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres-data:/var/lib/postgresql/data

    networks:
      - minishop-network

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    networks:
      - minishop-network

  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.2
    restart: unless-stopped
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    ports:
      - "8080:8080"
    networks:
      - minishop-network

  node-exporter:
    image: prom/node-exporter:latest
    restart: unless-stopped
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
    ports:
      - "9100:9100"
    networks:
      - minishop-network

  grafana:
    image: grafana/grafana:13.1.7
    container_name: minishop-grafana
    restart: unless-stopped
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "3001:3000"
    networks:
      - minishop-network

volumes:
  postgres-data:
  grafana_data:

networks:
  minishop-network:
