ame: MiniShop CI


on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:

  backend-test:
    name: Backend Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  backend-docker-build:
    name: Backend Docker Build
    runs-on: ubuntu-latest

    needs: backend-test

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build backend Docker image
        run: docker build -t minishop-backend:ci ./backend

  backend-publish:
    name: Publish Backend Image
    runs-on: ubuntu-latest

    needs:
      - backend-test

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Build and tag image
        run: |
          docker build \
            -t ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/minishop-backend:${{ github.sha }} \
            -t ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/minishop-backend:latest \
            ./backend

      - name: Push image
        run: |
          docker push ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/minishop-backend:${{ github.sha }}
          docker push ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/minishop-backend:latest

  deploy-backend:
    name: Deploy Backend
    runs-on: ubuntu-latest

    needs: 
      - backend-publish

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    env:
      IMAGE: ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/minishop-backend:${{ github.sha }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}

    steps:
        
      - name: checkout repository
        uses: actions/checkout@v4

      - name: Configure SSH
        shell: bash
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
            
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

          chmod 600 ~/.ssh/id_ed25519
          chmod 644 ~/.ssh/known_hosts

      - name: Test SSH connection
        run: |
          ssh \
            -i ~/.ssh/id_ed25519 \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "hostname && docker -v"

      - name: Copy deployment script
        run: |
          scp \
            -i ~/.ssh/id_ed25519 \
            scripts/deploy-backend.sh \
            "$DEPLOY_USER@$DEPLOY_HOST:/tmp/deploy-backend.sh"

      - name: Deploy backend
        run: |
          ssh \
            -i ~/.ssh/id_ed25519 \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "chmod +x /tmp/deploy-backend.sh && /tmp/deploy-backend.sh '$IMAGE'"

